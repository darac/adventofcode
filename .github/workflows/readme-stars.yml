---
name: Update Progress Image
on:
    schedule:
        - cron: "07 05 1-25 12 *" # 5:07 AM UTC, Dec 1-25
    workflow_dispatch: null
    workflow_run:
        types:
            - completed
        workflows:
            - Test
jobs:
    update-aoc-progress:
        if: >-
            ${{
                github.event_name != 'workflow_run' ||
                github.event.workflow_run.conclusion == 'success'
            }}
        runs-on: ubuntu-latest # renovate: runner

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Generate AoC progress
              run: python .github/aoc_progress.py

            - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
              with:
                  commit_message: Update AoC progress
                  file_pattern: .github/aoc_progress.svg
