---
name: Update Progress Image
on:
    schedule:
        - cron: "07 05 1-25 12 *" # 5:07 AM UTC, Dec 1-25
    workflow_dispatch: null
    workflow_run:
        types:
            - completed
        workflows:
            - Test
jobs:
    update-aoc-progress:
        if: >-
            ${{
                github.event_name != 'workflow_run' ||
                github.event.workflow_run.conclusion == 'success'
            }}
        runs-on: ubuntu-latest # renovate: runner

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Generate AoC progress
              run: python .github/generate_aoc_readme.py

            - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
              with:
                  commit_message: Update AoC progress
                  file_pattern: .github/aoc_progress.svg
